[tool.poetry]
name = "demo-e-commerce"
version = "0.1.0"
description = "E-commerce core: Product and Category classes"
authors = ["Nikita Fedoseev <bobinslive@gmail.com>"]
readme = "README.md"
packages = [{include = "main.py", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
black = "^24.0"
isort = "^5.13"
flake8 = "^7.0"
mypy = "^1.10"
pytest-cov = "^5.0"
pytest = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ================
# Black
# ================
[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

# ================
# isort
# ================
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["my_project"]
src_paths = ["src"]

# ================
# flake8
# ================
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E402"] # совместимость с Black
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
]

# ================
# mypy
# ================
[tool.mypy]
files = ["src"]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
exclude = ["venv", ".venv"]

# ================
# pytest
# ================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"